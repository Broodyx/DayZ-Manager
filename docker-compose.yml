x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  volumes:
    - dayz_storage:/var/www/html/storage/app/dayz
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      APP_ROLE: app
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10240}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    environment:
      APP_ROLE: worker

  scheduler:
    <<: *app
    environment:
      APP_ROLE: scheduler

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD:-}" ]; then
      exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
      else exec redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  dayz_storage:
